[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policypulse"
version = "0.1.0"
description = "Daily government meeting monitor: policy signal extraction and sector/stock mapping with full source traceability"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
policypulse = "policypulse.cli:main"

[tool.setuptools.packages.find]
include = ["policypulse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "network: hits the public internet (skipped by default)",
  "tongstock: requires the tongstock CLI on PATH (skipped by default)",
]
